<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarix Test — O'zbekiston tarixi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#FF8F1C; --primary-dark:#E67A00; --primary-light:#FFF4E5; --primary-glow:rgba(255,143,28,.3);
    --navy:#0D1B2A; --navy-2:#152740; --navy-3:#1E3A5F;
    --gold:#E5A93C;
    --bg:#F5F7FA; --surface:#FFFFFF; --line:#E8ECF1; --line-2:#F1F4F7;
    --ink:#0F172A; --ink-2:#334155; --sub:#64748B; --muted:#94A3B8;
    --ok:#10B981; --ok-light:#ECFDF5; --bad:#EF4444; --bad-light:#FEF2F2;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --shadow:0 2px 10px rgba(15,23,42,.04);
    --shadow-float:0 18px 40px rgba(13,27,42,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink-2);min-height:100vh;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font:inherit}
  :focus-visible{outline:3px solid rgba(255,143,28,.45);outline-offset:2px;border-radius:10px}

  /* ---------- Layout ---------- */
  .app{min-height:100vh}
  .sidebar{display:none}
  .shell{min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
  .tb-title{font-weight:800;color:var(--ink);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{font-size:.74rem;color:var(--muted)}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFB800,#FF7A00);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:1rem}
  .avatar-btn{border-radius:50%}
  .stats{display:flex;gap:6px}
  .stat-chip{background:#FFF9EE;border:1px solid #FFE8BA;color:#B45309;border-radius:12px;padding:6px 10px;font-size:.8rem;font-weight:800;white-space:nowrap}
  .view{flex:1;padding:16px 16px 116px;width:100%;max-width:1200px;margin:0 auto}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 22px rgba(13,27,42,.35)}
  .bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8B9BB0;font-size:.7rem;font-weight:700}
  .bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
  .bn.on{color:#FF9F2E}

  @media (min-width:820px){
    .app{display:grid;grid-template-columns:252px 1fr}
    .sidebar{display:flex;flex-direction:column;gap:6px;background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
    .shell{max-height:100vh;overflow-y:auto}
    .topbar{position:sticky;top:0}
    .bottom-nav,.mb-only{display:none!important}
    .view{padding:24px 28px 60px}
  }

  .brand{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}
  .brand h2{font-size:1.1rem;color:#fff;font-weight:800}
  .brand span{font-size:.74rem;color:#FF9F2E;font-weight:700}
  .sb-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px;margin-bottom:12px;text-align:left;width:100%}
  .sb-user b{display:block;color:#fff;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-user small{color:#FF9F2E;font-size:.72rem;font-weight:700}
  .sb{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#8B9BB0;font-weight:700;font-size:.9rem;width:100%;text-align:left}
  .sb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
  .sb:hover{background:rgba(255,255,255,.06);color:#fff}
  .sb.on{background:var(--primary);color:#fff;box-shadow:0 4px 14px var(--primary-glow)}
  .sb-admin{margin-top:auto;background:rgba(255,159,46,.14);border:1px solid rgba(255,159,46,.32);color:#FFB800;justify-content:center}

  /* ---------- Umumiy komponentlar ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;font-size:.9rem;min-height:44px;transition:transform .15s,box-shadow .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,#FF9F2E,var(--primary-dark));color:#fff;box-shadow:0 4px 14px var(--primary-glow)}
  .btn-ghost{background:#F1F4F8;color:var(--ink)}
  .btn-danger{background:var(--bad-light);color:#B91C1C}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px;font-size:.8rem;min-height:34px;border-radius:10px}

  .hero{background:linear-gradient(145deg,var(--navy),var(--navy-2));border:1.5px solid rgba(229,169,60,.45);border-radius:var(--r-lg);padding:22px;color:#fff;margin-bottom:22px;box-shadow:var(--shadow-float)}
  .hero h1{font-size:clamp(1.2rem,3.6vw,1.6rem);line-height:1.3;margin:10px 0 8px;color:#fff}
  .hero p{color:#BAC7D5;font-size:.88rem;line-height:1.5;margin-bottom:16px;max-width:640px}
  .tag-gold{display:inline-block;font-size:.72rem;font-weight:800;color:#FFB800;background:rgba(229,169,60,.15);border:1px solid rgba(229,169,60,.45);padding:4px 10px;border-radius:20px;letter-spacing:.04em}

  .sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  .sec-head h2{font-size:1.05rem;color:var(--ink);font-weight:800}
  .link{color:#D97706;font-weight:800;font-size:.84rem}

  .grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media (min-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
  .clickable{cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
  .clickable:hover{border-color:#FFD29D;transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.07)}
  .card h4{font-size:.98rem;color:var(--ink);font-weight:800;margin-bottom:4px;line-height:1.3}
  .card p{font-size:.82rem;color:var(--sub);line-height:1.45}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .row.wrap{flex-wrap:wrap}
  .muted{color:var(--muted);font-size:.82rem}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.92rem}

  .pill{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:8px;background:#F1F5F9;color:#475569;white-space:nowrap;display:inline-block}
  .pill.ok{background:var(--ok-light);color:#047857}
  .pill.warn{background:#FFF7E6;color:#B45309}
  .pill.bad{background:var(--bad-light);color:#B91C1C}
  .pill.oson{background:var(--ok-light);color:#047857}
  .pill.orta{background:#FFF4E5;color:#B45309}
  .pill.qiyin{background:var(--bad-light);color:#B91C1C}

  .ring{position:relative;width:52px;height:52px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bg{stroke:#EEF1F6}
  .ring .fg{stroke-linecap:round;transition:stroke-dashoffset .6s ease}
  .ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--ink)}
  .c-ok .fg{stroke:var(--ok)} .c-warn .fg{stroke:var(--primary)} .c-bad .fg{stroke:var(--bad)}
  .c-warn .lbl{color:#B45309} .c-bad .lbl{color:#B91C1C} .c-ok .lbl{color:#047857}

  .seg{display:flex;background:#EEF1F6;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);font-size:.86rem;transition:all .2s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:8px 0 16px}
  .pd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
  .pd .av{width:52px;height:52px;border-radius:50%;background:#FFF4E5;color:#B45309;font-weight:800;display:grid;place-items:center;font-size:1.05rem}
  .pd.first .av{width:66px;height:66px;background:linear-gradient(135deg,#FFB800,#FF7A00);color:#fff;font-size:1.3rem}
  .pd .stand{width:100%;border-radius:12px 12px 4px 4px;background:#fff;border:1px solid var(--line);padding-top:8px;font-weight:800;color:var(--muted)}
  .pd.first .stand{height:86px;background:#FFF9EE;border-color:#FFE8BA}
  .pd.second .stand{height:64px}
  .pd.third .stand{height:50px}
  .pd b{font-size:.84rem;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pd small{color:#D97706;font-weight:800;font-size:.76rem}

  .list{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .li{display:grid;grid-template-columns:30px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .li:last-child{border-bottom:0}
  .li.me{background:#FFF7EC}
  .li .rk{font-weight:800;color:var(--muted);text-align:center}
  .li .av2{width:38px;height:38px;border-radius:50%;background:#F1F4F8;display:grid;place-items:center;font-weight:800;color:var(--ink-2);font-size:.85rem}
  .li .nm{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
  .li .xp{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .li .xp small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}

  .tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm)}
  .tbl{width:100%;border-collapse:collapse;font-size:.84rem}
  .tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
  .tbl th{background:#F8FAFC;font-weight:800;color:var(--ink)}
  .tbl td .btns{display:flex;gap:6px;flex-wrap:wrap}

  /* ---------- Profil ---------- */
  .p-hero{background:linear-gradient(145deg,var(--navy),var(--navy-3));border-radius:var(--r-lg);padding:22px;color:#fff;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-float);margin-bottom:14px}
  .p-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(229,169,60,.35),transparent 70%)}
  .p-hero .avatar{width:68px;height:68px;font-size:1.6rem;border:3px solid rgba(255,255,255,.35);flex:none}
  .p-hero h3{font-size:1.2rem;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-hero small{color:#BAC7D5;font-size:.82rem}
  .p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .p-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
  .p-stat b{display:block;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .p-stat span{font-size:.74rem;color:var(--muted);font-weight:600}
  .p-list{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
  .p-item{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);text-align:left;font-weight:700;color:var(--ink)}
  .p-item:last-child{border-bottom:0}
  .p-item:hover{background:#FAFBFD}
  .p-item .ic{width:38px;height:38px;border-radius:12px;background:#FFF7EC;display:grid;place-items:center;font-size:1.05rem;flex:none}
  .p-item .arr{margin-left:auto;color:var(--muted);font-size:1.2rem}
  .p-item.danger{color:#B91C1C}
  .p-item.danger .ic{background:var(--bad-light)}
  .note-warn{background:#FFF7E6;color:#92400E;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;font-size:.84rem;font-weight:700;margin-bottom:12px}

  /* ---------- Modal va forma ---------- */
  .modal{position:fixed;inset:0;background:rgba(13,27,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px;z-index:2600}
  .modal.is-open{display:flex}
  .modal-card{background:#fff;width:100%;max-width:580px;max-height:92vh;border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .2s ease}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:1.02rem;font-weight:800;color:var(--ink)}
  .x-btn{width:34px;height:34px;border-radius:50%;background:#F1F4F8;font-size:1.2rem;color:var(--ink);display:grid;place-items:center;flex:none}
  .modal-body{padding:16px 18px 20px;overflow-y:auto}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:.8rem;font-weight:700;color:var(--ink);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FAFBFD;font-size:.9rem;color:var(--ink);outline:none;transition:border-color .2s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary)}
  .fld textarea{min-height:78px;resize:vertical}
  .fld-hint{font-size:.74rem;color:var(--muted);margin-top:4px}
  .form-err{color:#B91C1C;font-size:.82rem;font-weight:700;min-height:18px;margin:4px 0 8px}
  .form-foot{margin-top:10px;text-align:center;font-size:.84rem;color:var(--sub)}
  .form-foot button{color:#D97706;font-weight:800}
  .secret{font-size:1.5rem;font-weight:800;letter-spacing:.12em;background:#FFF9EE;border:1px dashed #E5A93C;border-radius:14px;padding:14px;text-align:center;color:#92400E;margin:10px 0}

  /* ---------- Test (quiz) ekrani ---------- */
  .quiz{position:fixed;inset:0;background:var(--navy);z-index:2500;display:none;flex-direction:column;color:#fff}
  .quiz.is-open{display:flex}
  .quiz-top{padding:max(14px,env(safe-area-inset-top,14px)) 16px 12px;display:flex;align-items:center;gap:12px}
  .q-bar{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden}
  .q-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFA438,#FF7A00);transition:width .35s ease;border-radius:10px}
  .q-count{font-size:.82rem;font-weight:800;color:#FFB800;white-space:nowrap}
  .q-timer{position:relative;width:46px;height:46px;flex:none}
  .q-timer svg{width:100%;height:100%;transform:rotate(-90deg)}
  .q-timer circle{fill:none;stroke-width:4}
  .q-timer .bg{stroke:rgba(255,255,255,.15)}
  .q-timer .fg{stroke:#FF9F2E;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
  .q-timer.danger .fg{stroke:#EF4444}
  .q-timer .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.95rem}
  .q-timer.danger .n{color:#FCA5A5;animation:pulse .5s infinite alternate}
  .q-x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:1.2rem;flex:none}
  .q-body{flex:1;overflow-y:auto;padding:10px 18px 24px;max-width:640px;width:100%;margin:0 auto}
  .q-cat{font-size:.74rem;color:#FFB800;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .q-text{font-size:clamp(1rem,3.8vw,1.22rem);font-weight:800;line-height:1.45;margin-bottom:18px}
  .q-img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:14px}
  .q-opts{display:flex;flex-direction:column;gap:10px}
  .q-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;background:#17273F;border:1.5px solid #243652;color:#fff;font-weight:700;font-size:.92rem;min-height:52px;transition:all .15s}
  .q-opt:hover:not(:disabled){border-color:#FF9F2E;background:#1C3050}
  .q-opt:disabled{cursor:default}
  .q-opt .l{width:28px;height:28px;border-radius:8px;background:#243652;display:grid;place-items:center;font-weight:800;flex:none;font-size:.8rem}
  .q-opt.ok{background:rgba(16,185,129,.16);border-color:#10B981}
  .q-opt.ok .l{background:#10B981}
  .q-opt.bad{background:rgba(239,68,68,.16);border-color:#EF4444;animation:shake .3s}
  .q-opt.bad .l{background:#EF4444}
  .q-expl{margin-top:16px;padding:12px 14px;border-radius:12px;background:#17273F;font-size:.88rem;line-height:1.5;color:#D6DEEA;border-left:3px solid #FF9F2E}
  .q-expl b{color:#fff}
  .q-note{font-size:.76rem;color:#8B9BB0;text-align:center;margin-top:14px}
  .q-next{margin-top:14px;width:100%}

  /* ---------- Natija va sharh ---------- */
  .res-head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
  .res-facts{flex:1;display:grid;gap:8px;min-width:0}
  .res-facts div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
  .res-facts span{color:var(--muted)}
  .res-facts b{color:var(--ink);font-weight:800;text-align:right}
  .rv{padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
  .rv.ok{border-color:#A7F3D0;background:#F0FDF7}
  .rv.bad{border-color:#FECACA;background:#FEF6F5}
  .rv.skip{background:#F8FAFC}
  .rv-q{font-weight:800;color:var(--ink);font-size:.88rem;margin-bottom:6px;line-height:1.4}
  .rv-a{font-size:.82rem;color:var(--ink-2)}
  .rv-c{font-size:.82rem;color:#047857;font-weight:700;margin-top:3px}
  .rv-e{font-size:.8rem;color:var(--sub);margin-top:6px;line-height:1.45}

  /* ---------- Drawer (mobil menyu) ---------- */
  .drawer{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:1800;display:none}
  .drawer.is-open{display:block}
  .drawer-panel{width:82%;max-width:320px;height:100%;background:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;animation:slide .25s ease;overflow-y:auto}
  .drawer-title{font-size:.72rem;font-weight:800;color:#D97706;text-transform:uppercase;letter-spacing:.06em;padding:4px 12px 10px}
  .mi{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-weight:700;color:var(--ink);width:100%;text-align:left}
  .mi .ic{width:36px;height:36px;border-radius:10px;background:#FFF7EC;display:grid;place-items:center;font-size:1rem;flex:none}
  .mi:hover{background:var(--primary-light)}
  .mi.admin{background:#FFF7EC;border:1px solid #FFE4C2;color:#92400E;margin-top:auto}

  /* ---------- Ustoz paneli ---------- */
  .admin{position:fixed;inset:0;background:#F3F5F9;z-index:2200;display:none;flex-direction:column;overflow:hidden}
  .admin.is-open{display:flex}
  .admin-top{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;padding:max(14px,env(safe-area-inset-top,14px)) 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .admin-top h2{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .admin-top .tag{font-size:.7rem;background:rgba(229,169,60,.2);color:#FFD27A;border:1px solid rgba(229,169,60,.4);padding:2px 8px;border-radius:20px;font-weight:800}
  .admin-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .admin-tabs button{padding:9px 14px;border-radius:12px;font-weight:700;font-size:.84rem;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .admin-tabs button:hover{background:#F4F6FA}
  .admin-tabs button.on{background:var(--primary-light);color:#B45309;box-shadow:inset 0 0 0 1.5px #FFD6A3}
  .admin-body{flex:1;overflow:auto;padding:16px;width:100%;max-width:1100px;margin:0 auto}
  .admin-body .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .admin-body select{padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:.86rem;color:var(--ink)}
  .a-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .a-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .a-stat b{display:block;font-size:1.4rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .a-stat span{font-size:.76rem;color:var(--muted);font-weight:600}
  .a-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .a-card h4{font-size:.92rem;color:var(--ink);font-weight:800;line-height:1.35}
  .a-card .meta{font-size:.78rem;color:var(--muted)}
  .a-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .a-section{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 10px}

  /* ---------- Xabarlar ---------- */
  .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:4000;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 28px);max-width:420px;pointer-events:none}
  .toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s;pointer-events:auto;text-align:center}
  .toast.error{background:#B91C1C}
  .toast.ok{background:#047857}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:4500}

  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .x-btn,.q-x{position:relative;font-size:0;padding:0;display:block}
  .x-btn{color:var(--ink)}
  .q-x{color:#fff}
  .x-btn::before,.x-btn::after,.q-x::before,.q-x::after{content:'';position:absolute;left:50%;top:50%;width:14px;height:2.2px;background:currentColor;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
  .x-btn::after,.q-x::after{transform:translate(-50%,-50%) rotate(-45deg)}
</style>
</head>

<div class="app">

  <!-- Desktop sidebar -->

    <button class="bn" data-action="nav" data-view="history" id="bn-history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Yechilgan</button>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ================= Yordamchilar ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString('en-US').replace(/,/g, ' ');
  const pad = n => String(n).padStart(2, '0');
  const fmtDate = iso => {
    const d = new Date(iso);
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const LVL = { oson: 'Oson', orta: "O'rta", qiyin: 'Qiyin' };
  const pctTone = p => (p >= 75 ? 'c-ok' : p >= 50 ? 'c-warn' : 'c-bad');
  const pctPill = p => (p >= 75 ? 'ok' : p >= 50 ? 'warn' : 'bad');
  const pctLabel = p => (p >= 75 ? "A'lo" : p >= 50 ? 'Qoniqarli' : 'Qoniqarsiz');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* xotira yopiq */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* */ } },
  };
  const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* */ } };
  const ssDel = k => { try { sessionStorage.removeItem(k); } catch { /* */ } };

  const ring = (p, size = 52, stroke = 5, tone = pctTone(p)) => {
    const r = (size - stroke * 2) / 2;
    const C = 2 * Math.PI * r;
    return `<div class="ring ${tone}" style="width:${size}px;height:${size}px" aria-label="${p} foiz">
      <svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle class="bg" cx="${size / 2}" cy="${size / 2}" r="${r}" style="stroke-width:${stroke}"/>
        <circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" style="stroke-width:${stroke};stroke-dasharray:${C};stroke-dashoffset:${C * (1 - p / 100)}"/>
      </svg>
      <div class="lbl" style="font-size:${size > 80 ? '1.2rem' : '.8rem'}">${p}%</div></div>`;
  };

  const tableHTML = (heads, rows) => `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  /* ================= Holat ================= */
  const state = {
    token: store.get('tt_token'),
    user: null,
    levels: null,
    testSize: null,
    view: 'topics',
    adminToken: ssGet('tt_admin'),
    adminTab: 'users',
    materials: null,
    history: null,
    quiz: null,
    rankPeriod: 'weekly',
    qFilter: 'all',
    questionCache: [],
  };

  const TOPICS = [
    { key: 'Amir Temur', icon: '🏛️', title: 'Amir Temur Saltanati', desc: "Anqara jangi, davlat boshqaruvi va me'morchilik" },
    { key: 'Qadimgi', icon: '🏺', title: "Qadimgi O'zbekiston", desc: "Baqtriya, So'g'diyona, Xorazm va Kushonlar" },
    { key: 'Xorazmshohlar', icon: '⚔️', title: 'Xorazmshohlar va Jaloliddin', desc: "Mo'g'ullarga qarshi kurash va Sind jasorati" },
    { key: 'Temuriylar', icon: '🔭', title: "Ulug'bek va Temuriylar", desc: 'Samarqand rasadxonasi va ilm-fan' },
    { key: 'Boburiylar', icon: '👑', title: 'Boburiylar davri', desc: 'Bobur, Panipat jangi va Hindiston' },
    { key: 'Jadidchilik', icon: '📖', title: "Jadidlar va Milliy Uyg'onish", desc: "Ma'rifatparvarlar va Turkiston Muxtoriyati" },
    { key: 'Mustaqillik', icon: '🇺🇿', title: "Mustaqil O'zbekiston", desc: "Mustaqillik va BMTga a'zolik" },
  ];

  /* ================= API ================= */
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (opts.admin) { if (state.adminToken) headers['x-admin-token'] = state.adminToken; }
    else if (state.token) headers.Authorization = 'Bearer ' + state.token;

    let res;
    try {
      res = await fetch(path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
    } catch {
      throw new Error("Server bilan aloqa yo'q. Serverni (localhost:3000) tekshiring.");
    }
    let data = {};
    try { data = await res.json(); } catch { /* bo'sh javob */ }

    if (!res.ok || data.success === false) {
      if (res.status === 401) {
        if (opts.admin) adminLogout(true);
        else if (state.token && !opts.noAuthReset) clearSession();
      }
      const err = new Error(data.message || (res.status === 404 ? 'Manzil topilmadi (server eski bo\'lishi mumkin)' : 'Xatolik yuz berdi'));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  /* ================= Xabar va modal ================= */
  function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    $('#toasts').append(el);
    setTimeout(() => el.remove(), 3200);
  }

  let modalLocked = false;
  function openModal(title, html, { locked = false } = {}) {
    modalLocked = locked;
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = html;
    $('#modal-x').hidden = locked;
    $('#modal').classList.add('is-open');
  }
  function closeModal() {
    if (modalLocked) return;
    $('#modal').classList.remove('is-open');
    $('#modal-body').innerHTML = '';
  }

  function openForm({ title, fields, submitText = 'Saqlash', onSubmit, values = {}, footer = '', locked = false }) {
    const fieldHTML = f => {
      const v = values[f.name] ?? '';
      const id = `f-${f.name}`;
      let input;
      if (f.type === 'select') {
        input = `<select id="${id}" name="${f.name}">${f.options.map(([val, label]) =>
          `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select>`;
      } else if (f.type === 'textarea') {
        input = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''}>${esc(v)}</textarea>`;
      } else {
        input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}>`;
      }
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="fld-hint">${esc(f.hint)}</div>` : ''}</div>`;
    };

    openModal(title, `
      <form id="gen-form" novalidate>
        ${fields.map(fieldHTML).join('')}
        <div class="form-err" id="form-err" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">${esc(submitText)}</button>
        ${footer}
      </form>`, { locked });

    const form = $('#gen-form');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const err = $('#form-err');
      err.textContent = '';
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        await onSubmit(data);
        closeModal();
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
      }
    });
    const first = form.querySelector('input,select,textarea');
    if (first) setTimeout(() => first.focus(), 60);
  }

  /* ================= Sessiya ================= */
  function setSession(token, user) {
    state.token = token;
    state.user = user;
    store.set('tt_token', token);
    renderChrome();
    if (user.mustChangePassword) openChangePassword(true);
  }
  function clearSession() {
    state.token = null;
    state.user = null;
    state.history = null;
    store.del('tt_token');
    renderChrome();
    if (state.view === 'history' || state.view === 'profile') navigate('topics');
  }

  async function restoreSession() {
    if (!state.token) return;
    try {
      const r = await api('/api/auth/me');
      state.user = r.user;
    } catch {
      clearSession();
    }
  }

  /* ================= Chrome (sarlavha, sidebar, statistika) ================= */
  const TITLES = {
    topics: ['Asosiy', "O'zbekiston tarixi bo'yicha testlar"],
    history: ['Yechilganlar', 'Sizning test natijalaringiz'],
    ranking: ['Peshqadamlar', 'Reyting jadvali'],
    certificate: ['Milliy sertifikat', 'DTM formatidagi testlar'],
    videos: ['Video darsliklar', "Tarix bo'yicha video darslar"],
    books: ['Kitoblar va manbalar', "Darslik va qo'llanmalar"],
    profile: ['Profil', "Hisob ma'lumotlari"],
  };

  function renderChrome() {
    const u = state.user;
    const initial = u ? (u.name[0] || '?').toUpperCase() : '?';
    $('#sb-avatar').textContent = initial;
    $('#mb-avatar').textContent = initial;
    $('#sb-name').textContent = u ? u.name : 'Mehmon';
    $('#sb-tag').textContent = u ? "★ O'quvchi" : 'Kirish ›';
    $('#st-streak').textContent = u ? u.streak : 0;
    $('#st-xp').textContent = fmt(u ? u.weeklyXp : 0);
    const [t, s] = TITLES[state.view] || TITLES.topics;
    $('#page-title').textContent = t;
    $('#page-sub').textContent = s;
    $$('.sb[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
    $$('.bn[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
    document.title = `${t} — Tarix Test`;
  }

  /* ================= Navigatsiya ================= */
  async function navigate(view) {
    state.view = view;
    closeDrawer();
    renderChrome();
    const v = $('#view');
    v.innerHTML = '<div class="empty">Yuklanmoqda…</div>';
    window.scrollTo(0, 0);
    try {
      if (view === 'topics') return renderTopics();
      if (view === 'history') return await renderHistory();
      if (view === 'ranking') return await renderRanking();
      if (view === 'certificate') return renderCertificate();
      if (view === 'videos') return await renderVideos();
      if (view === 'books') return await renderBooks();
      if (view === 'profile') return renderProfile();
    } catch (e) {
      v.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  }

  /* ================= Sahifalar ================= */
  function renderTopics() {
    $('#view').innerHTML = `
      <section class="hero">
        <span class="tag-gold">FAQAT O'ZBEKISTON TARIXI</span>

  function openAuth(mode) {
    const isLogin = mode === 'login';
    const switchHTML = `<div class="form-foot">${isLogin
      ? "Hisobingiz yo'qmi? <button type=\"button\" data-action=\"auth-switch\" data-mode=\"register\">Ro'yxatdan o'ting</button>"
      : "Hisobingiz bormi? <button type=\"button\" data-action=\"auth-switch\" data-mode=\"login\">Kirish</button>"}</div>`;

    openForm({
      title: isLogin ? 'Kirish' : "Ro'yxatdan o'tish",
      submitText: isLogin ? 'Kirish' : "Ro'yxatdan o'tish",
      fields: [
        { name: 'name', label: 'Ism-familiya', required: true, placeholder: 'Masalan: Jasur Rahimov', autocomplete: 'username', hint: '3–40 belgi. Ism takrorlanmaydi.' },
        { name: 'password', label: 'Parol', type: 'password', required: true, placeholder: 'Kamida 6 belgi', autocomplete: isLogin ? 'current-password' : 'new-password' },
      ],
      footer: switchHTML,
      onSubmit: async d => {
        const name = (d.name || '').trim();
        if (name.length < 3) throw new Error("Ism kamida 3 belgi bo'lsin");
        if ((d.password || '').length < 6) throw new Error("Parol kamida 6 belgi bo'lsin");
        const r = await api(isLogin ? '/api/auth/login' : '/api/auth/register', { method: 'POST', body: { name, password: d.password }, noAuthReset: true });
        setSession(r.token, r.user);
        toast(isLogin ? `Xush kelibsiz, ${r.user.name}!` : "Ro'yxatdan o'tdingiz!");
        navigate(state.view);
      },
    });
  }

  function openChangePassword(forced = false) {
    openForm({
      title: forced ? "Yangi parol o'rnating" : "Parolni o'zgartirish",
      locked: forced,
      submitText: 'Saqlash',
      fields: [
        { name: 'oldPassword', label: 'Eski parol', type: 'password', required: true },
        { name: 'newPassword', label: 'Yangi parol', type: 'password', required: true, hint: 'Kamida 6 belgi' },
        { name: 'confirm', label: 'Yangi parolni takrorlang', type: 'password', required: true },
      ],
      onSubmit: async d => {
        if (d.newPassword !== d.confirm) throw new Error('Yangi parollar bir xil emas');
        await api('/api/auth/change-password', { method: 'POST', body: { oldPassword: d.oldPassword, newPassword: d.newPassword } });
        state.user.mustChangePassword = false;
        toast('Parol yangilandi');
        if (state.view === 'profile') renderProfile();
      },
    });
  }

  async function openLevelPicker(type, topic, title) {

    try { await ensureLevels(); } catch (e) { toast(e.message, 'error'); return; }

    const cards = Object.entries(state.levels).map(([key, l]) => `

        <span class="pill ${key}" style="min-width:74px;text-align:center;font-size:.8rem">${esc(l.label)}</span>

      </button>`).join('');
    openModal('Qiyinlikni tanlang', `
      <p style="margin-bottom:14px;color:var(--sub)"><b style="color:var(--ink)">${esc(title)}</b> — darajani tanlang. Vaqt tugasa savol 0 ball bilan o'tkaziladi.</p>
      ${cards}`);
  }

  async function startQuiz(type, topic, level, title) {
    closeModal();
    if (state.quiz) return;
    try {
      const r = await api('/api/tests/start', { method: 'POST', body: { type, topic, level } });
      state.quiz = {
        testId: r.testId, total: r.total, seconds: r.seconds, xp: r.xp,
        levelLabel: r.levelLabel, title, locked: false, finishing: false,
        timer: null, started: 0, current: null, pending: null,
      };
      $('#quiz').classList.add('is-open');
      document.body.style.overflow = 'hidden';
      showQuestion(r.question);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function showQuestion(q) {
    const Q = state.quiz;
    if (!Q) return;
    Q.locked = false;
    Q.pending = null;
    Q.current = q;
    $('#q-bar').style.width = `${(q.index / Q.total) * 100}%`;
    $('#q-count').textContent = `${q.index + 1} / ${Q.total}`;
    $('#q-cat').textContent = `${q.category} · ${Q.levelLabel}`;
    $('#q-text').textContent = q.question;
    const img = $('#q-img');
    if (q.image && /^https?:\/\//.test(q.image)) { img.src = q.image; img.hidden = false; }
    else { img.hidden = true; img.removeAttribute('src'); }
    $('#q-opts').innerHTML = q.options.map((o, i) =>
      `<button class="q-opt" data-action="answer" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('');
    $('#q-expl').hidden = true;
    $('#q-expl').innerHTML = '';
    $('#q-next').hidden = true;
    $('#q-body').scrollTop = 0;
    startTimer(Q.seconds);
  }

  function startTimer(seconds) {
    const Q = state.quiz;
    clearInterval(Q.timer);
    Q.started = Date.now();
    const C = 2 * Math.PI * 19;
    const ringEl = $('#q-ring');
    ringEl.style.strokeDasharray = C;
    const tick = () => {
      const remain = Math.max(0, seconds - (Date.now() - Q.started) / 1000);
      $('#q-sec').textContent = Math.ceil(remain);
      ringEl.style.strokeDashoffset = C * (1 - remain / seconds);
      $('#q-timer').classList.toggle('danger', remain <= 5);
      if (remain <= 0) {
        clearInterval(Q.timer);
        answer(-1);
      }
    };
    tick();
    Q.timer = setInterval(tick, 200);
  }

  async function answer(sel) {
    const Q = state.quiz;
    if (!Q || Q.locked) return;
    Q.locked = true;
    clearInterval(Q.timer);
    $$('#q-opts .q-opt').forEach(b => { b.disabled = true; });
    try {
      const r = await api('/api/tests/answer', { method: 'POST', body: { testId: Q.testId, selectedIndex: sel } });
      $$('#q-opts .q-opt').forEach(b => {
        const i = Number(b.dataset.i);
        if (i === r.correctIndex) b.classList.add('ok');
        else if (i === sel && !r.isCorrect) b.classList.add('bad');
      });
      const head = r.timedOut ? '⏱ Vaqt tugadi (0 ball)' : r.isCorrect ? `✅ To'g'ri! +${Q.xp} XP` : "❌ Noto'g'ri";
      const expl = $('#q-expl');
      expl.innerHTML = `<b>${head}</b>${r.explanation ? `<br>${esc(r.explanation)}` : ''}`;
      expl.hidden = false;
      $('#q-next').textContent = r.done ? "Natijani ko'rish" : 'Keyingi savol →';
      $('#q-next').hidden = false;
      Q.pending = r;
    } catch (e) {
      Q.locked = false;
      toast(e.message, 'error');
    }
  }

  function quizNext() {
    const Q = state.quiz;
    if (!Q || !Q.pending) return;
    const r = Q.pending;
    Q.pending = null;
    if (r.done) {
      closeQuiz();
      showResult(r.submission);
    } else {
      showQuestion(r.next);
    }
  }

  async function finishQuiz(cheated, note) {
    const Q = state.quiz;
    if (!Q || Q.finishing) return;
    Q.finishing = true;
    clearInterval(Q.timer);
    try {
      const r = await api('/api/tests/finish', { method: 'POST', body: { testId: Q.testId, cheated } });
      closeQuiz();
      showResult(r.submission, note);
    } catch (e) {
      closeQuiz();
      toast(e.message, 'error');
    }
  }

  function closeQuiz() {
    const Q = state.quiz;
    if (Q) clearInterval(Q.timer);
    state.quiz = null;
    $('#quiz').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function quizExit() {
    if (!state.quiz || state.quiz.finishing) return;
    openForm({
      title: 'Testdan chiqish',
      submitText: 'Ha, chiqish',
      fields: [],
      onSubmit: () => finishQuiz(true, 'Test vaqtidan oldin tugatildi — natija 0 ball.'),
      footer: '<div class="form-foot">Chiqsangiz, test yakunlanadi va 0 ball beriladi.</div>',
    });
  }

  function reviewHTML(details) {
    return details.map((d, i) => `
      <div class="rv ${d.isCorrect ? 'ok' : d.timedOut ? 'skip' : 'bad'}">
        <div class="rv-q">${i + 1}. ${esc(d.question)}</div>
        <div class="rv-a">${d.timedOut ? '⏱ Vaqt tugadi' : `Sizning javob: ${esc(d.options[d.selectedIndex] ?? '—')}`}</div>
        ${!d.isCorrect ? `<div class="rv-c">To'g'ri: ${esc(d.options[d.correctIndex] ?? '—')}</div>` : ''}
        ${d.explanation ? `<div class="rv-e">${esc(d.explanation)}</div>` : ''}
      </div>`).join('');
  }

  function summaryHTML(s, note) {
    return `
      ${note ? `<div class="note-warn" style="background:var(--bad-light);color:#B91C1C;border-color:#FECACA">${esc(note)}</div>` : ''}
      ${s.cheated && !note ? '<div class="note-warn" style="background:var(--bad-light);color:#B91C1C;border-color:#FECACA">Test chiqib ketish sababli 0 ball bilan yakunlandi.</div>' : ''}
      <div class="res-head">
        ${ring(s.percentage, 96, 8)}
        <div class="res-facts">
          <div><span>To'g'ri javob</span><b>${s.correctCount} / ${s.totalQuestions}</b></div>
          <div><span>Daraja</span><b>${esc(s.levelLabel || LVL[s.level] || '')}</b></div>
          <div><span>Olingan XP</span><b>+${fmt(s.xp)}</b></div>
          <div><span>Holat</span><b>${pctLabel(s.percentage)}</b></div>
        </div>
      </div>`;
  }

  function showResult(sub, note) {
    if (!sub) { toast('Natija topilmadi', 'error'); return; }
    if (state.user) {
      state.user.weeklyXp += sub.xp;
      state.user.monthlyXp += sub.xp;
      state.user.testsCount += 1;
      renderChrome();
    }
    state.history = null;
    if (sub.percentage >= 90 && !sub.cheated) celebrate();
    openModal(`Natija — ${sub.testTitle}`, `
      ${summaryHTML(sub, note)}
      <h4 style="margin:6px 0 10px;color:var(--ink)">Savollar sharhi</h4>
      ${reviewHTML(sub.details || [])}
      <button class="btn btn-primary btn-block" data-action="modal-close" style="margin-top:8px">Yopish</button>`);
  }

  async function openHistoryDetail(id) {
    if (!state.history) state.history = (await api('/api/user/history')).history;
    const h = state.history.find(x => x.id === id);
    if (!h) return;
    openModal(h.testTitle, `
      <div style="color:var(--muted);font-size:.84rem;margin:-6px 0 12px">${fmtDate(h.createdAt)}</div>
      ${summaryHTML(h)}
      <h4 style="margin:6px 0 10px;color:var(--ink)">Savollar sharhi</h4>
      ${reviewHTML(h.details || [])}`);
  }

  function celebrate() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti');
    const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#FF8F1C', '#E5A93C', '#10B981', '#FFFFFF', '#3B82F6'];
    const parts = Array.from({ length: 140 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * .3,
      vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
      s: 6 + Math.random() * 6, r: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)],
    }));
    let frames = 0;
    const loop = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += .1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
      });
      if (++frames < 200) requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, c.width, c.height);
    };
    loop();
  }

  /* ================= Video ================= */
  function openVideo(id) {
    const v = (state.materials?.videos || []).find(x => x.id === id);
    if (!v) return;
    openModal(v.title, `
      <div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000">
        <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.embedId)}" title="${esc(v.title)}"
          style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <p style="margin-top:12px">${esc(v.desc)}</p>
      <div class="muted" style="margin-top:6px">${esc(v.topic)} · ${esc(v.duration)}</div>`);
  }

  /* ================= Mobil drawer ================= */
  function openDrawer() { $('#drawer').classList.add('is-open'); }
  function closeDrawer() { $('#drawer').classList.remove('is-open'); }

  /* ================= Ustoz paneli ================= */
  function openAdmin() {
    if (!state.adminToken) { openAdminLogin(); return; }
    closeDrawer();
    $('#admin').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    adminTab(state.adminTab);
  }

  function openAdminLogin() {
    closeDrawer();
    openForm({
      title: 'Ustoz paneli — kirish',
      submitText: 'Kirish',
      fields: [{ name: 'password', label: 'Ustoz paroli', type: 'password', required: true, autocomplete: 'current-password' }],
      onSubmit: async d => {
        const r = await api('/api/admin/login', { method: 'POST', body: { password: d.password }, admin: true });
        state.adminToken = r.adminToken;
        ssSet('tt_admin', r.adminToken);
        openAdmin();
      },
    });
  }

  function adminLogout(silent = false) {
    state.adminToken = null;
    ssDel('tt_admin');
    $('#admin').classList.remove('is-open');
    document.body.style.overflow = '';
    toast(silent ? 'Sessiya tugadi. Qayta kiring.' : 'Ustoz paneldan chiqdingiz', silent ? 'error' : 'ok');
  }

  function adminTab(tab) {
    state.adminTab = tab;
    $$('#admin-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('#admin-body').innerHTML = '<div class="empty">Yuklanmoqda…</div>';
    const fn = { users: adminUsers, subs: adminSubs, questions: adminQuestions, materials: adminMaterials, settings: adminSettings }[tab];
    fn().catch(e => { $('#admin-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
  }

  async function adminUsers() {
    const { users } = await api('/api/admin/users', { admin: true });
    const totalTests = users.reduce((s, u) => s + u.tests, 0);
    const totalXp = users.reduce((s, u) => s + (u.weeklyXp || 0), 0);
    $('#admin-body').innerHTML = `
      <div class="a-stats">
        <div class="a-stat"><b>${users.length}</b><span>O'quvchilar</span></div>
        <div class="a-stat"><b>${totalTests}</b><span>Yechilgan testlar</span></div>
        <div class="a-stat"><b>${fmt(totalXp)}</b><span>Haftalik XP (jami)</span></div>
      </div>
      <div class="a-section">Ro'yxat</div>
      ${users.length ? tableHTML(
        ["O'quvchi", 'Testlar', 'Haftalik XP', 'Faollik', 'Amallar'],
        users.map(u => [
          `<b>${esc(u.name)}</b>${u.mustChangePassword ? ' <span class="pill warn">vaqtinchalik parol</span>' : ''}`,
          u.tests,
          fmt(u.weeklyXp),
          `🔥 ${u.streak} kun`,
          `<div class="btns">
            <button class="btn btn-ghost btn-sm" data-action="admin-reset" data-id="${esc(u.id)}" data-name="${esc(u.name)}">Parolni yangilash</button>
            <button class="btn btn-danger btn-sm" data-action="admin-del-user" data-id="${esc(u.id)}" data-name="${esc(u.name)}">O'chirish</button>
          </div>`,
        ])) : '<div class="card empty">Hali o\'quvchilar yo\'q.</div>'}`;
  }

  async function adminSubs() {
    const { submissions } = await api('/api/admin/submissions', { admin: true });
    $('#admin-body').innerHTML = submissions.length ? tableHTML(
      ["O'quvchi", 'Test', 'Daraja', 'Natija', "To'g'ri", 'Holat', 'Sana'],
      submissions.map(s => [
        esc(s.userName),
        esc(s.testTitle),
        esc(LVL[s.level] || s.levelLabel || ''),
        `<b>${s.percentage}%</b>`,
        `${s.correctCount}/${s.totalQuestions}`,
        s.cheated ? '<span class="pill bad">Chiqib ketgan</span>' : `<span class="pill ${pctPill(s.percentage)}">${pctLabel(s.percentage)}</span>`,
        fmtDate(s.createdAt),
      ])) : '<div class="card empty">Hali natijalar yo\'q.</div>';
  }

  async function adminQuestions() {
    const { questions } = await api('/api/admin/questions', { admin: true });
    state.questionCache = questions;
    const filter = state.qFilter;
    const list = questions.filter(q => filter === 'all' || q.level === filter || q.type === filter);
    $('#admin-body').innerHTML = `
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" data-action="admin-add-question">+ Savol qo'shish</button>
        <select id="q-filter" aria-label="Filtr">
          <option value="all" ${filter === 'all' ? 'selected' : ''}>Hammasi (${questions.length})</option>
          <option value="oson" ${filter === 'oson' ? 'selected' : ''}>Oson</option>
          <option value="orta" ${filter === 'orta' ? 'selected' : ''}>O'rta</option>
          <option value="qiyin" ${filter === 'qiyin' ? 'selected' : ''}>Qiyin</option>
          <option value="certificate" ${filter === 'certificate' ? 'selected' : ''}>Milliy sertifikat</option>
        </select>
      </div>
      <div class="grid">${list.map(q => `
        <div class="a-card">
          <div class="row wrap">
            <span class="pill ${q.level}">${esc(LVL[q.level] || q.level)}</span>
            <span class="pill">${q.type === 'certificate' ? 'Sertifikat' : 'Mavzu'}</span>
          </div>
          <h4>${esc(q.question)}</h4>
          <div class="meta">${esc(q.category)} · To'g'ri: <b style="color:#047857">${esc(q.options[q.correct] ?? '—')}</b></div>
          <div class="acts">
            <button class="btn btn-ghost btn-sm" data-action="admin-edit-question" data-id="${esc(q.id)}">Tahrirlash</button>
            <button class="btn btn-danger btn-sm" data-action="admin-del-question" data-id="${esc(q.id)}">O'chirish</button>
          </div>
        </div>`).join('') || '<div class="card empty">Savollar yo\'q.</div>'}</div>`;
    $('#q-filter').addEventListener('change', e => { state.qFilter = e.target.value; adminQuestions(); });
  }

  function questionForm(existing) {
    const o = existing?.options || [];
    openForm({
      title: existing ? 'Savolni tahrirlash' : 'Yangi savol',
      submitText: 'Saqlash',
      values: {
        type: existing?.type || 'topic', level: existing?.level || 'orta', category: existing?.category || '',
        question: existing?.question || '', o1: o[0] || '', o2: o[1] || '', o3: o[2] || '', o4: o[3] || '',
        correct: String(existing?.correct ?? 0), explanation: existing?.explanation || '', image: existing?.image || '',
      },
      fields: [
        { name: 'type', label: 'Turi', type: 'select', options: [['topic', 'Mavzu testi'], ['certificate', 'Milliy sertifikat']] },
        { name: 'level', label: 'Qiyinlik', type: 'select', options: [['oson', 'Oson'], ['orta', "O'rta"], ['qiyin', 'Qiyin']] },
        { name: 'category', label: 'Mavzu', required: true, placeholder: 'Masalan: Amir Temur Saltanati' },
        { name: 'question', label: 'Savol matni', type: 'textarea', required: true },
        { name: 'o1', label: 'Variant A', required: true },
        { name: 'o2', label: 'Variant B', required: true },
        { name: 'o3', label: 'Variant C', required: true },
        { name: 'o4', label: 'Variant D', required: true },
        { name: 'correct', label: "To'g'ri javob", type: 'select', options: [['0', 'A'], ['1', 'B'], ['2', 'C'], ['3', 'D']] },
        { name: 'explanation', label: "Izoh (javobdan keyin ko'rinadi)", type: 'textarea' },
        { name: 'image', label: 'Rasm havolasi (ixtiyoriy)', placeholder: 'https://…' },
      ],
      onSubmit: async d => {
        const body = {
          type: d.type, level: d.level, category: d.category, question: d.question,
          options: [d.o1, d.o2, d.o3, d.o4], correct: Number(d.correct),
          explanation: d.explanation, image: d.image,
        };
        await api(existing ? `/api/admin/questions/${encodeURIComponent(existing.id)}` : '/api/admin/questions',
          { method: existing ? 'PUT' : 'POST', body, admin: true });
        toast('Savol saqlandi');
        adminTab('questions');
      },
    });
  }

  async function adminMaterials() {
    const r = await api('/api/materials');
    state.materials = r.materials;
    const vids = r.materials.videos || [];
    const books = r.materials.books || [];
    $('#admin-body').innerHTML = `
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" data-action="admin-add-material" data-kind="video">+ Video</button>
        <button class="btn btn-primary btn-sm" data-action="admin-add-material" data-kind="book">+ Kitob</button>
      </div>
      <div class="a-section">Video darsliklar (${vids.length})</div>
      <div class="grid">${vids.map(v => `
        <div class="a-card"><h4>${esc(v.title)}</h4><div class="meta">${esc(v.topic)} · ${esc(v.duration)}</div>
          <div class="acts">
            <button class="btn btn-ghost btn-sm" data-action="admin-edit-material" data-id="${esc(v.id)}">Tahrirlash</button>
            <button class="btn btn-danger btn-sm" data-action="admin-del-material" data-id="${esc(v.id)}">O'chirish</button>
          </div></div>`).join('') || '<div class="card empty">Video yo\'q</div>'}</div>
      <div class="a-section">Kitoblar (${books.length})</div>
      <div class="grid">${books.map(b => `
        <div class="a-card"><h4>${esc(b.title)}</h4><div class="meta">${esc(b.author)} · ${fmt(b.pages)} bet</div>
          <div class="acts">
            <button class="btn btn-ghost btn-sm" data-action="admin-edit-material" data-id="${esc(b.id)}">Tahrirlash</button>
            <button class="btn btn-danger btn-sm" data-action="admin-del-material" data-id="${esc(b.id)}">O'chirish</button>
          </div></div>`).join('') || '<div class="card empty">Kitob yo\'q</div>'}</div>`;
  }

  function materialForm(kind, existing) {
    const isVideo = kind === 'video';
    const fields = isVideo ? [
      { name: 'title', label: 'Video nomi', required: true },
      { name: 'topic', label: 'Mavzu', placeholder: 'Masalan: Temuriylar davri' },
      { name: 'duration', label: 'Davomiylik', placeholder: '12:34', hint: 'daqiqa:soniya' },
      { name: 'url', label: 'YouTube havolasi', required: true, placeholder: 'https://www.youtube.com/watch?v=…' },
      { name: 'desc', label: 'Qisqa tavsif', type: 'textarea' },
    ] : [
      { name: 'title', label: 'Kitob nomi', required: true },
      { name: 'author', label: 'Muallif' },
      { name: 'grade', label: 'Sinf / turi', placeholder: 'Masalan: 8-sinf' },
      { name: 'pages', label: 'Sahifalar soni', type: 'number', min: 1, max: 5000, required: true },
      { name: 'fileUrl', label: 'Havola (PDF yoki sahifa)', placeholder: 'https://…' },
      { name: 'desc', label: 'Qisqa tavsif', type: 'textarea' },
    ];
    openForm({
      title: `${existing ? 'Tahrirlash' : 'Yangi'} — ${isVideo ? 'video' : 'kitob'}`,
      submitText: 'Saqlash',
      fields,
      values: existing || {},
      onSubmit: async d => {
        const body = { ...d, kind };
        if (!isVideo) body.pages = Number(d.pages);
        await api(existing ? `/api/admin/materials/${encodeURIComponent(existing.id)}` : '/api/admin/materials',
          { method: existing ? 'PUT' : 'POST', body, admin: true });
        state.materials = null;
        toast('Material saqlandi');
        adminTab('materials');
      },
    });
  }

  function adminSettings() {
    $('#admin-body').innerHTML = `
      <div class="grid" style="max-width:820px">
        <div class="a-card">
          <h4>🔑 Ustoz paroli</h4>
          <div class="meta">Parolni yangilasangiz, barcha ustoz sessiyalari tugaydi.</div>
          <div class="acts"><button class="btn btn-primary btn-sm" data-action="admin-change-pass">Parolni o'zgartirish</button></div>
        </div>
        <div class="a-card">
          <h4>📡 Ulanish manzili</h4>
          <div class="meta" id="admin-info">Yuklanmoqda…</div>
        </div>
      </div>`;
    api('/api/admin/info', { admin: true }).then(r => {
      const el = $('#admin-info');
      if (el) el.innerHTML = `O'quvchilar telefonda shu manzildan kiradi: <b style="color:var(--ink)">${esc(r.mobileUrl)}</b>`;
    }).catch(() => {});
  }

  function adminChangePass() {
    openForm({
      title: "Ustoz parolini o'zgartirish",
      submitText: 'Saqlash',
      fields: [
        { name: 'newPassword', label: 'Yangi parol', type: 'password', required: true, hint: 'Kamida 6 belgi' },
        { name: 'confirm', label: 'Takrorlang', type: 'password', required: true },
      ],
      onSubmit: async d => {
        if (d.newPassword !== d.confirm) throw new Error('Parollar bir xil emas');
        await api('/api/admin/change-password', { method: 'POST', body: { newPassword: d.newPassword }, admin: true });
        adminLogout(true);
        toast('Parol yangilandi. Qayta kiring.');
      },
    });
  }

  /* ================= Hodisalar (delegatsiya) ================= */
  const actions = {
    nav: el => navigate(el.dataset.view),
    'drawer-open': () => openDrawer(),
    account: () => { closeDrawer(); openAccount(); },
    logout: () => logout(),
    'auth-switch': el => openAuth(el.dataset.mode),
    'change-password': () => openChangePassword(false),
    'start-test': el => openLevelPicker(el.dataset.type, el.dataset.topic, el.dataset.title),
    'pick-level': el => startQuiz(el.dataset.type, el.dataset.topic, el.dataset.level, el.dataset.title),
    answer: el => answer(Number(el.dataset.i)),
    'quiz-next': () => quizNext(),
    'quiz-exit': () => quizExit(),
    'history-detail': el => openHistoryDetail(el.dataset.id),
    'rank-period': el => { state.rankPeriod = el.dataset.period; navigate('ranking'); },
    'open-video': el => openVideo(el.dataset.id),
    'modal-close': () => closeModal(),
    'admin-open': () => openAdmin(),
    'admin-close': () => { $('#admin').classList.remove('is-open'); document.body.style.overflow = ''; },
    'admin-logout': () => adminLogout(false),
    'admin-tab': el => adminTab(el.dataset.tab),
    'admin-reset': async el => {
      try {
        const r = await api(`/api/admin/users/${encodeURIComponent(el.dataset.id)}/reset-password`, { method: 'POST', admin: true });
        openModal('Vaqtinchalik parol', `
          <p><b>${esc(r.name)}</b> uchun yangi parol berildi. O'quvchi shu parol bilan kiradi va keyin o'zi almashtiradi.</p>
          <div class="secret" id="secret">${esc(r.tempPassword)}</div>
          <button class="btn btn-ghost btn-block" data-action="copy-secret">Nusxalash</button>`);
        adminUsers();
      } catch (e) { toast(e.message, 'error'); }
    },
    'copy-secret': async () => {
      try { await navigator.clipboard.writeText($('#secret').textContent); toast('Nusxalandi'); }
      catch { toast("Nusxalab bo'lmadi. Qo'lda belgilang.", 'error'); }
    },
    'admin-del-user': el => openForm({
      title: "O'quvchini o'chirish",
      submitText: "Ha, o'chirish",
      fields: [],
      footer: `<div class="form-foot"><b>${esc(el.dataset.name)}</b> akkaunti va uning natijalari butunlay o'chadi.</div>`,
      onSubmit: async () => {
        await api(`/api/admin/users/${encodeURIComponent(el.dataset.id)}`, { method: 'DELETE', admin: true });
        toast("O'quvchi o'chirildi");
        adminUsers();
      },
    }),
    'admin-add-question': () => questionForm(null),
    'admin-edit-question': el => questionForm(state.questionCache.find(q => q.id === el.dataset.id)),
    'admin-del-question': el => openForm({
      title: "Savolni o'chirish",
      submitText: "Ha, o'chirish",
      fields: [],
      footer: "<div class=\"form-foot\">Bu savol qaytarib bo'lmaydi.</div>",
      onSubmit: async () => {
        await api(`/api/admin/questions/${encodeURIComponent(el.dataset.id)}`, { method: 'DELETE', admin: true });
        toast("Savol o'chirildi");
        adminQuestions();
      },
    }),
    'admin-add-material': el => materialForm(el.dataset.kind, null),
    'admin-edit-material': el => {
      const all = [...(state.materials?.videos || []), ...(state.materials?.books || [])];
      const item = all.find(x => x.id === el.dataset.id);
      if (item) materialForm(item.embedId ? 'video' : 'book', item);
    },
    'admin-del-material': el => openForm({
      title: "Materialni o'chirish",
      submitText: "Ha, o'chirish",
      fields: [],
      footer: "<div class=\"form-foot\">Material o'chiriladi.</div>",
      onSubmit: async () => {
        await api(`/api/admin/materials/${encodeURIComponent(el.dataset.id)}`, { method: 'DELETE', admin: true });
        state.materials = null;
        toast("Material o'chirildi");
        adminTab('materials');
      },
    }),
    'admin-change-pass': () => adminChangePass(),
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) {
      // Menyu fonini bosganda yopish
      if (e.target.id === 'drawer') closeDrawer();
      return;
    }
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.quiz) quizExit();
    else if ($('#modal').classList.contains('is-open')) closeModal();
    else if ($('#drawer').classList.contains('is-open')) closeDrawer();
  });

  // Test paytida boshqa oynaga o'tish — anti-cheat
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.quiz && !state.quiz.finishing) {
      finishQuiz(true, 'Testdan chiqib ketish taqiqlangan — natija 0 ball.');
    }
  });

  /* ================= Ishga tushirish ================= */
  (async function init() {
    renderChrome();
    await restoreSession();
    renderChrome();
    navigate('topics');
  })();
})();
</script>
</body>
</html>
